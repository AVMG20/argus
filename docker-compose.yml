# The whole of Argus: the app and its database.
#
#   docker compose up -d      → http://localhost:3000
#
# Everything below has a working default, so a fresh clone runs without any
# configuration. Override any of them in a .env file next to this one — Compose
# reads it automatically. For a public deployment set at least BETTER_AUTH_URL.
services:
  argus:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Defaults to the bundled database below. Point it at your own Postgres
      # instead and the `postgres` service simply goes unused.
      DATABASE_URL: ${DATABASE_URL:-postgresql://argus:argus@postgres:5432/argus}
      # The public URL people reach this instance on. Sign-in cookies and
      # invitation links are built from it, so it has to match the browser bar.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Leave unset and a strong secret is generated once and kept in the
      # argus_data volume. Set it explicitly to control it yourself — changing
      # it invalidates every existing session.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PORT: 3000
    ports:
      - '${ARGUS_PORT:-3000}:3000'
    volumes:
      - argus_data:/app/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/sign-in > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # These credentials are internal to this Compose project and appear in the
    # DATABASE_URL default above. The port is published on loopback only, so the
    # database is reachable from this host — for `bun run dev` and drizzle-kit —
    # and from nowhere else.
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports:
      - '127.0.0.1:55329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U argus -d argus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  argus_data:
